<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #fceabb, #f8b500);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 15px 0;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .navbar a {
            color: white;
            margin: 0 20px;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.3s ease;
        }

        .navbar a:hover {
            color: #ff4d4d;
        }

        .result-box {
            background-color: #fff;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            margin: 100px auto 0 auto;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 1.8em;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #ff7f50;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            margin: 10px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #ff5722;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/">Home</a>
        <a href="/">About</a>
        <!-- <a href="/prediction">Predict</a> -->
        <a href="/photo_prediction">Predict</a>
        <a href="/">Contact</a>
    </div>

    <div class="result-box">
        <h2>{{ prediction_text }}</h2>
        <a href="/" class="btn">Go Back</a>
        <a href="/prediction" class="btn">Check with blood report</a>
    </div>

</body>
</html>
